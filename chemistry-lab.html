<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chemistry Lab - Interactive Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #stage-title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            opacity: 0;
            transition: opacity 0.5s;
        }

        #stage-title.visible {
            opacity: 1;
        }

        #chemical-palette {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: all;
        }

        .chemical-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .chemical-button:hover {
            transform: scale(1.1);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 6px 25px rgba(255,255,255,0.4);
        }

        .chemical-button.selected {
            border-color: white;
            box-shadow: 0 0 30px currentColor;
        }

        .chemical-label {
            position: absolute;
            right: 75px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .chemical-button:hover .chemical-label {
            opacity: 1;
        }

        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            max-width: 600px;
            line-height: 1.6;
        }

        #transition-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(200,220,255,0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
            z-index: 100;
        }

        #transition-screen.active {
            opacity: 1;
        }

        #transition-message {
            font-size: 32px;
            font-weight: 300;
            color: #333;
            text-align: center;
            letter-spacing: 2px;
        }

        #progress-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            opacity: 0.7;
        }

        .beaker-info {
            position: absolute;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #vial-container {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: all;
        }

        .vial-slot {
            width: 50px;
            height: 80px;
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 10px;
            cursor: grab;
            transition: all 0.3s;
            position: relative;
            background: rgba(255,255,255,0.1);
        }

        .vial-slot:hover {
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .vial-slot.dragging {
            cursor: grabbing;
            opacity: 0.5;
        }

        .vial-slot.empty {
            opacity: 0.3;
        }

        .vial-label {
            position: absolute;
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 11px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="overlay">
        <div id="stage-title"></div>
        <div id="progress-indicator"></div>
        <div id="instructions"></div>

        <div id="chemical-palette">
            <!-- Stage 1 chemicals -->
        </div>

        <div id="vial-container" style="display: none;">
            <!-- Stage 2 vials -->
        </div>
    </div>

    <div id="transition-screen">
        <div id="transition-message"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="chemistry-lab.js"></script>
</body>
</html>
