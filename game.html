<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D化学实验室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 1000;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            border-radius: 10px;
        }

        #chemicals {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: all;
        }

        .chemical-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .chemical-btn:hover {
            transform: scale(1.15);
            border-color: white;
            box-shadow: 0 6px 25px rgba(255,255,255,0.5);
        }

        .chemical-btn.selected {
            border-width: 4px;
            border-color: white;
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
        }

        #stage-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="loading">
        <div class="spinner"></div>
        <div>正在加载3D化学实验室...</div>
    </div>

    <div id="ui" style="display: none;">
        <div id="title">3D化学实验室</div>
        <div id="stage-info">阶段 1 / 2 | 完成: 0 / 6</div>
        <div id="instructions">点击右侧选择化学品，然后点击烧杯添加</div>
        <div id="chemicals"></div>
    </div>

    <!-- 使用直接脚本标签加载Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        console.log('开始初始化...');
        console.log('THREE:', typeof THREE);

        // 等待Three.js加载完成
        window.addEventListener('load', function() {
            console.log('页面加载完成，THREE:', typeof THREE);

            if (typeof THREE === 'undefined') {
                document.getElementById('loading').innerHTML =
                    '<div style="color: red;">加载失败：Three.js未加载<br>请刷新页面重试</div>';
                return;
            }

            initApp();
        });

        function initApp() {
            console.log('初始化应用...');

            // 配置
            const CHEMICALS = [
                { name: '黄', color: 0xFFFF00 },
                { name: '蓝', color: 0x0066FF },
                { name: '绿', color: 0x00FF66 },
                { name: '紫', color: 0x9933FF },
                { name: '红', color: 0xFF3333 },
                { name: '橙', color: 0xFF9933 },
                { name: '青', color: 0x00FFFF }
            ];

            let selectedChemical = null;
            let beakers = [];
            let completedCount = 0;

            // 创建场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0f0ff);
            scene.fog = new THREE.Fog(0xe0f0ff, 10, 50);

            // 创建相机
            const camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 4, 10);
            camera.lookAt(0, 0, 0);

            // 创建渲染器
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);

            // 添加控制器
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 20;

            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // 添加地板
            const floorGeometry = new THREE.PlaneGeometry(30, 30);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.2,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1;
            floor.receiveShadow = true;
            scene.add(floor);

            // 添加桌子
            const tableGeometry = new THREE.BoxGeometry(10, 0.2, 5);
            const tableMaterial = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.5
            });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.y = -0.1;
            table.castShadow = true;
            table.receiveShadow = true;
            scene.add(table);

            // 创建6个烧杯
            const beakerGroup = new THREE.Group();
            for (let i = 0; i < 6; i++) {
                const beakerObj = createBeaker(i);
                const x = (i % 3 - 1) * 2.5;
                const z = Math.floor(i / 3) * 2 - 1;
                beakerObj.group.position.set(x, 0, z);
                beakerGroup.add(beakerObj.group);
                beakers.push({
                    group: beakerObj.group,
                    glass: beakerObj.glass,
                    substances: [],
                    liquids: []
                });
            }
            scene.add(beakerGroup);

            function createBeaker(index) {
                const group = new THREE.Group();

                // 底座
                const baseGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.08, 32);
                const baseMaterial = new THREE.MeshStandardMaterial({
                    color: 0x999999,
                    metalness: 0.5,
                    roughness: 0.3
                });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = 0.04;
                base.castShadow = true;
                group.add(base);

                // 玻璃烧杯
                const glassGeometry = new THREE.CylinderGeometry(0.35, 0.3, 1.2, 32, 1, true);
                const glassMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0xddffff,
                    transparent: true,
                    opacity: 0.25,
                    roughness: 0,
                    metalness: 0.1,
                    transmission: 0.95,
                    thickness: 0.5,
                    side: THREE.DoubleSide
                });
                const glass = new THREE.Mesh(glassGeometry, glassMaterial);
                glass.position.y = 0.6;
                glass.userData.beakerIndex = index;
                group.add(glass);

                // 底部
                const bottomGeometry = new THREE.CircleGeometry(0.3, 32);
                const bottom = new THREE.Mesh(bottomGeometry, glassMaterial);
                bottom.rotation.x = -Math.PI / 2;
                bottom.position.y = 0.08;
                group.add(bottom);

                return { group, glass };
            }

            // 创建化学品按钮
            const chemicalsDiv = document.getElementById('chemicals');
            CHEMICALS.forEach((chem, index) => {
                const btn = document.createElement('div');
                btn.className = 'chemical-btn';
                btn.style.background = `radial-gradient(circle, #${chem.color.toString(16).padStart(6, '0')}, #${(chem.color * 0.7).toString(16).padStart(6, '0')})`;
                btn.textContent = chem.name;
                btn.onclick = () => selectChemical(index);
                chemicalsDiv.appendChild(btn);
            });

            function selectChemical(index) {
                selectedChemical = index;
                const btns = document.querySelectorAll('.chemical-btn');
                btns.forEach((btn, i) => {
                    btn.classList.toggle('selected', i === index);
                });
                updateInstructions();
            }

            function updateInstructions() {
                const inst = document.getElementById('instructions');
                if (selectedChemical === null) {
                    inst.textContent = '点击右侧选择化学品';
                } else {
                    inst.textContent = `已选择${CHEMICALS[selectedChemical].name}色 - 点击烧杯添加（每个烧杯3种物质）`;
                }
            }

            function updateStageInfo() {
                document.getElementById('stage-info').textContent = `阶段 1 / 2 | 完成: ${completedCount} / 6`;
            }

            // 点击检测
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('click', (event) => {
                if (selectedChemical === null) return;

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);

                for (let intersect of intersects) {
                    if (intersect.object.userData.beakerIndex !== undefined) {
                        addChemicalToBeaker(intersect.object.userData.beakerIndex);
                        break;
                    }
                }
            });

            function addChemicalToBeaker(index) {
                const beaker = beakers[index];
                if (beaker.substances.length >= 3) {
                    alert('这个烧杯已满！');
                    return;
                }

                const chemical = CHEMICALS[selectedChemical];
                beaker.substances.push(chemical);

                // 添加液体
                const liquidHeight = beaker.substances.length * 0.25;
                const mixedColor = mixColors(beaker.substances.map(s => s.color));

                // 移除旧液体
                beaker.liquids.forEach(liquid => beaker.group.remove(liquid));
                beaker.liquids = [];

                // 创建新液体
                const liquidGeometry = new THREE.CylinderGeometry(0.32, 0.28, liquidHeight, 32);
                const liquidMaterial = new THREE.MeshStandardMaterial({
                    color: mixedColor,
                    transparent: true,
                    opacity: 0.7,
                    roughness: 0.2,
                    metalness: 0.1
                });
                const liquid = new THREE.Mesh(liquidGeometry, liquidMaterial);
                liquid.position.y = 0.08 + liquidHeight / 2;
                beaker.group.add(liquid);
                beaker.liquids.push(liquid);

                console.log(`烧杯${index}添加${chemical.name}色，当前${beaker.substances.length}/3`);

                // 检查是否完成
                if (beaker.substances.length === 3) {
                    triggerReaction(index);
                }
            }

            function mixColors(colors) {
                if (colors.length === 0) return 0xffffff;
                let r = 0, g = 0, b = 0;
                colors.forEach(color => {
                    r += (color >> 16) & 255;
                    g += (color >> 8) & 255;
                    b += color & 255;
                });
                const count = colors.length;
                return ((r/count) << 16) | ((g/count) << 8) | (b/count);
            }

            function triggerReaction(index) {
                const beaker = beakers[index];
                console.log(`烧杯${index}开始反应！`);

                // 简单动画：液体发光
                const liquid = beaker.liquids[0];
                if (liquid) {
                    let glowAmount = 0;
                    const glowInterval = setInterval(() => {
                        glowAmount += 0.1;
                        liquid.material.emissive = new THREE.Color(beaker.substances[0].color);
                        liquid.material.emissiveIntensity = Math.sin(glowAmount) * 0.5 + 0.5;

                        if (glowAmount > Math.PI * 4) {
                            clearInterval(glowInterval);
                            liquid.material.emissiveIntensity = 0;
                            completeBeaker();
                        }
                    }, 50);
                }

                function completeBeaker() {
                    completedCount++;
                    updateStageInfo();

                    if (completedCount === 6) {
                        setTimeout(() => {
                            alert('恭喜！阶段1完成！\n\n所有烧杯实验已完成。\n在完整版本中，这里会自动进入阶段2的蒸馏室。');
                        }, 500);
                    }
                }
            }

            // 窗口调整
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            // 隐藏加载界面，显示UI
            document.getElementById('loading').style.display = 'none';
            document.getElementById('ui').style.display = 'block';

            // 开始动画
            animate();

            console.log('初始化完成！');
        }
    </script>
</body>
</html>
