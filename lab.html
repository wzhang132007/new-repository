<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学实验室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            width: 95vw;
            max-width: 1200px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
        }

        #header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        #stage-info {
            font-size: 16px;
            opacity: 0.9;
        }

        #main-area {
            flex: 1;
            display: flex;
            position: relative;
            padding: 20px;
            gap: 20px;
        }

        #beakers-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
        }

        .beaker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            position: relative;
        }

        .beaker-container:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .beaker-container.completed {
            border-color: #51cf66;
            background: #d3f9d8;
        }

        .beaker {
            width: 100px;
            height: 140px;
            position: relative;
            background: linear-gradient(to bottom,
                rgba(200, 230, 255, 0.2) 0%,
                rgba(200, 230, 255, 0.4) 100%);
            border: 3px solid rgba(100, 150, 200, 0.5);
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
        }

        .beaker::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            height: 5px;
            background: rgba(100, 150, 200, 0.6);
            border-radius: 5px 5px 0 0;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: all 0.4s ease;
            border-radius: 0 0 7px 7px;
        }

        .liquid.reacting {
            animation: glow 1s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: brightness(1);
                box-shadow: inset 0 0 20px rgba(255,255,255,0.3);
            }
            50% {
                filter: brightness(1.4);
                box-shadow: inset 0 0 30px rgba(255,255,255,0.6);
            }
        }

        .beaker-label {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }

        .substance-indicator {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .substance-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid white;
        }

        #chemicals-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chemical-btn {
            height: 60px;
            border-radius: 12px;
            border: 3px solid rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .chemical-btn:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .chemical-btn.selected {
            border-width: 5px;
            border-color: white;
            transform: translateX(-10px) scale(1.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .reaction-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particle-rise 2s ease-out forwards;
        }

        @keyframes particle-rise {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5);
            }
        }

        #completion-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #completion-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }

        .modal-content h2 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>🧪 化学实验室 🧪</h1>
            <div id="stage-info">阶段 1/2 | 完成: 0/6</div>
        </div>

        <div id="main-area">
            <div id="beakers-area"></div>

            <div id="chemicals-panel"></div>

            <div id="instructions">👉 点击右侧选择一种化学品，然后点击烧杯添加</div>
        </div>
    </div>

    <div id="completion-modal">
        <div class="modal-content">
            <h2>🎉 恭喜完成！</h2>
            <p>你已经完成了所有6个烧杯的化学实验！<br><br>观察每个烧杯的颜色变化和反应效果，这就是化学的魅力！</p>
            <button class="modal-btn" onclick="location.reload()">重新开始</button>
        </div>
    </div>

    <script>
        const CHEMICALS = [
            { name: '黄色', color: '#FFD700', rgb: 'rgb(255, 215, 0)' },
            { name: '蓝色', color: '#0066FF', rgb: 'rgb(0, 102, 255)' },
            { name: '绿色', color: '#00FF66', rgb: 'rgb(0, 255, 102)' },
            { name: '紫色', color: '#9933FF', rgb: 'rgb(153, 51, 255)' },
            { name: '红色', color: '#FF3333', rgb: 'rgb(255, 51, 51)' },
            { name: '橙色', color: '#FF9933', rgb: 'rgb(255, 153, 51)' },
            { name: '青色', color: '#00FFFF', rgb: 'rgb(0, 255, 255)' }
        ];

        let selectedChemical = null;
        let beakers = [];
        let completedCount = 0;

        // 初始化
        function init() {
            createBeakers();
            createChemicalButtons();
            updateInstructions();
        }

        // 创建烧杯
        function createBeakers() {
            const beakersArea = document.getElementById('beakers-area');
            for (let i = 0; i < 6; i++) {
                const container = document.createElement('div');
                container.className = 'beaker-container';
                container.innerHTML = `
                    <div class="beaker">
                        <div class="reaction-particles"></div>
                    </div>
                    <div class="beaker-label">烧杯 ${i + 1}</div>
                    <div class="substance-indicator"></div>
                `;
                container.onclick = () => addChemicalToBeaker(i);
                beakersArea.appendChild(container);

                beakers.push({
                    element: container,
                    beakerElement: container.querySelector('.beaker'),
                    substances: [],
                    completed: false
                });
            }
        }

        // 创建化学品按钮
        function createChemicalButtons() {
            const panel = document.getElementById('chemicals-panel');
            CHEMICALS.forEach((chem, index) => {
                const btn = document.createElement('div');
                btn.className = 'chemical-btn';
                btn.style.background = `linear-gradient(135deg, ${chem.color}, ${darkenColor(chem.color)})`;
                btn.textContent = chem.name;
                btn.onclick = () => selectChemical(index);
                panel.appendChild(btn);
            });
        }

        // 选择化学品
        function selectChemical(index) {
            selectedChemical = index;
            const btns = document.querySelectorAll('.chemical-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('selected', i === index);
            });
            updateInstructions();
        }

        // 添加化学品到烧杯
        function addChemicalToBeaker(beakerIndex) {
            if (selectedChemical === null) {
                alert('请先选择一种化学品！');
                return;
            }

            const beaker = beakers[beakerIndex];
            if (beaker.completed) {
                alert('这个烧杯已经完成反应了！');
                return;
            }

            if (beaker.substances.length >= 3) {
                alert('这个烧杯已满！');
                return;
            }

            const chemical = CHEMICALS[selectedChemical];
            beaker.substances.push(chemical);

            updateBeakerVisual(beakerIndex);

            if (beaker.substances.length === 3) {
                triggerReaction(beakerIndex);
            }
        }

        // 更新烧杯视觉
        function updateBeakerVisual(beakerIndex) {
            const beaker = beakers[beakerIndex];
            const beakerElement = beaker.beakerElement;

            // 移除旧液体
            const oldLiquid = beakerElement.querySelector('.liquid');
            if (oldLiquid) oldLiquid.remove();

            // 计算混合颜色
            const mixedColor = mixColors(beaker.substances.map(s => s.rgb));
            const height = (beaker.substances.length / 3) * 100;

            // 创建新液体
            const liquid = document.createElement('div');
            liquid.className = 'liquid';
            liquid.style.background = `linear-gradient(to top, ${mixedColor}, ${lightenColor(mixedColor)})`;
            liquid.style.height = height + '%';
            beakerElement.appendChild(liquid);

            // 更新指示器
            const indicator = beaker.element.querySelector('.substance-indicator');
            indicator.innerHTML = '';
            beaker.substances.forEach(sub => {
                const dot = document.createElement('div');
                dot.className = 'substance-dot';
                dot.style.background = sub.color;
                indicator.appendChild(dot);
            });
        }

        // 触发反应
        function triggerReaction(beakerIndex) {
            const beaker = beakers[beakerIndex];
            const liquid = beaker.beakerElement.querySelector('.liquid');

            liquid.classList.add('reacting');

            // 创建粒子效果
            createParticles(beaker.beakerElement, beaker.substances[0].color);

            setTimeout(() => {
                liquid.classList.remove('reacting');
                beaker.completed = true;
                beaker.element.classList.add('completed');
                completedCount++;
                updateStageInfo();

                if (completedCount === 6) {
                    setTimeout(() => {
                        document.getElementById('completion-modal').classList.add('show');
                    }, 1000);
                }
            }, 3000);
        }

        // 创建粒子
        function createParticles(container, color) {
            const particlesContainer = container.querySelector('.reaction-particles');
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.width = (Math.random() * 8 + 4) + 'px';
                    particle.style.height = particle.style.width;
                    particle.style.background = color;
                    particle.style.left = (Math.random() * 80 + 10) + '%';
                    particle.style.bottom = '10%';
                    particlesContainer.appendChild(particle);

                    setTimeout(() => particle.remove(), 2000);
                }, i * 100);
            }
        }

        // 混合颜色
        function mixColors(rgbStrings) {
            let r = 0, g = 0, b = 0;
            rgbStrings.forEach(rgb => {
                const matches = rgb.match(/\d+/g);
                r += parseInt(matches[0]);
                g += parseInt(matches[1]);
                b += parseInt(matches[2]);
            });
            const count = rgbStrings.length;
            return `rgb(${Math.floor(r/count)}, ${Math.floor(g/count)}, ${Math.floor(b/count)})`;
        }

        // 加深颜色
        function darkenColor(hex) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.max(0, ((num >> 16) & 0xff) - 40);
            const g = Math.max(0, ((num >> 8) & 0xff) - 40);
            const b = Math.max(0, (num & 0xff) - 40);
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        // 提亮颜色
        function lightenColor(rgb) {
            const matches = rgb.match(/\d+/g);
            const r = Math.min(255, parseInt(matches[0]) + 60);
            const g = Math.min(255, parseInt(matches[1]) + 60);
            const b = Math.min(255, parseInt(matches[2]) + 60);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // 更新提示
        function updateInstructions() {
            const inst = document.getElementById('instructions');
            if (selectedChemical === null) {
                inst.textContent = '👉 点击右侧选择一种化学品，然后点击烧杯添加';
            } else {
                inst.textContent = `已选择：${CHEMICALS[selectedChemical].name} | 👆 点击烧杯添加（每个烧杯需要3种物质）`;
            }
        }

        // 更新阶段信息
        function updateStageInfo() {
            document.getElementById('stage-info').textContent = `阶段 1/2 | 完成: ${completedCount}/6`;
        }

        // 启动
        init();
    </script>
</body>
</html>
