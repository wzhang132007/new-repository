<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学实验室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            width: 95vw;
            max-width: 1200px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
        }

        #header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        #stage-info {
            font-size: 16px;
            opacity: 0.9;
        }

        #main-area {
            flex: 1;
            display: flex;
            position: relative;
            padding: 20px;
            gap: 20px;
        }

        #beakers-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
        }

        .beaker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            position: relative;
        }

        .beaker-container:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .beaker-container.completed {
            border-color: #51cf66;
            background: #d3f9d8;
        }

        .beaker {
            width: 100px;
            height: 140px;
            position: relative;
            background: linear-gradient(to bottom,
                rgba(200, 230, 255, 0.2) 0%,
                rgba(200, 230, 255, 0.4) 100%);
            border: 3px solid rgba(100, 150, 200, 0.5);
            border-radius: 0 0 10px 10px;
            overflow: visible;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
        }

        .beaker::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            height: 5px;
            background: rgba(100, 150, 200, 0.6);
            border-radius: 5px 5px 0 0;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: all 0.4s ease;
            border-radius: 0 0 7px 7px;
            overflow: hidden;
        }

        .beaker-label {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }

        .substance-indicator {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .substance-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid white;
        }

        .reaction-type {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .beaker-container.completed .reaction-type {
            opacity: 1;
        }

        #chemicals-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chemical-btn {
            height: 60px;
            border-radius: 12px;
            border: 3px solid rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .chemical-btn:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .chemical-btn.selected {
            border-width: 5px;
            border-color: white;
            transform: translateX(-10px) scale(1.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 气泡效果 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            border: 1px solid rgba(255,255,255,0.5);
            animation: bubble-rise 2s ease-out forwards;
        }

        @keyframes bubble-rise {
            0% {
                opacity: 1;
                transform: translateY(0) translateX(0) scale(0.5);
            }
            50% {
                transform: translateY(-60px) translateX(10px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) translateX(-5px) scale(0.3);
            }
        }

        /* 爆炸粒子 */
        .explosion-particle {
            position: absolute;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.2);
            }
        }

        /* 蒸汽效果 */
        .steam {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.7), rgba(200,200,200,0.3));
            border-radius: 50%;
            animation: steam-rise 3s ease-out forwards;
        }

        @keyframes steam-rise {
            0% {
                opacity: 0.8;
                transform: translateY(0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) scale(2);
            }
        }

        /* 颜色变化动画 */
        .color-change {
            animation: color-pulse 2s ease-in-out;
        }

        @keyframes color-pulse {
            0%, 100% {
                filter: brightness(1);
            }
            25% {
                filter: brightness(1.5) saturate(1.5);
            }
            50% {
                filter: brightness(2) saturate(2);
            }
            75% {
                filter: brightness(1.5) saturate(1.5);
            }
        }

        /* 震动效果 */
        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* 发光效果 */
        .glow {
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: brightness(1);
                box-shadow: inset 0 0 20px rgba(255,255,255,0.3);
            }
            50% {
                filter: brightness(1.6);
                box-shadow: inset 0 0 40px rgba(255,255,255,0.8);
            }
        }

        #completion-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #completion-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }

        .modal-content h2 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>🧪 化学实验室 🧪</h1>
            <div id="stage-info">阶段 1/2 | 完成: 0/6</div>
        </div>

        <div id="main-area">
            <div id="beakers-area"></div>

            <div id="chemicals-panel"></div>

            <div id="instructions">👉 点击右侧选择一种化学品，然后点击烧杯添加</div>
        </div>
    </div>

    <div id="completion-modal">
        <div class="modal-content">
            <h2>🎉 恭喜完成！</h2>
            <p id="completion-summary"></p>
            <button class="modal-btn" onclick="location.reload()">重新开始</button>
        </div>
    </div>

    <script>
        const CHEMICALS = [
            { name: '黄色', color: '#FFD700', rgb: 'rgb(255, 215, 0)' },
            { name: '蓝色', color: '#0066FF', rgb: 'rgb(0, 102, 255)' },
            { name: '绿色', color: '#00FF66', rgb: 'rgb(0, 255, 102)' },
            { name: '紫色', color: '#9933FF', rgb: 'rgb(153, 51, 255)' },
            { name: '红色', color: '#FF3333', rgb: 'rgb(255, 51, 51)' },
            { name: '橙色', color: '#FF9933', rgb: 'rgb(255, 153, 51)' },
            { name: '青色', color: '#00FFFF', rgb: 'rgb(0, 255, 255)' }
        ];

        const REACTION_TYPES = {
            EXPLOSION: { name: '💥爆炸', emoji: '💥' },
            BUBBLES: { name: '💧气泡', emoji: '💧' },
            STEAM: { name: '💨蒸汽', emoji: '💨' },
            COLOR_CHANGE: { name: '🌈变色', emoji: '🌈' },
            GLOW: { name: '✨发光', emoji: '✨' }
        };

        let selectedChemical = null;
        let beakers = [];
        let completedCount = 0;
        let reactionSummary = [];

        function init() {
            createBeakers();
            createChemicalButtons();
            updateInstructions();
        }

        function createBeakers() {
            const beakersArea = document.getElementById('beakers-area');
            for (let i = 0; i < 6; i++) {
                const container = document.createElement('div');
                container.className = 'beaker-container';
                container.innerHTML = `
                    <div class="reaction-type"></div>
                    <div class="beaker"></div>
                    <div class="beaker-label">烧杯 ${i + 1}</div>
                    <div class="substance-indicator"></div>
                `;
                container.onclick = () => addChemicalToBeaker(i);
                beakersArea.appendChild(container);

                beakers.push({
                    element: container,
                    beakerElement: container.querySelector('.beaker'),
                    substances: [],
                    completed: false,
                    reactionType: null
                });
            }
        }

        function createChemicalButtons() {
            const panel = document.getElementById('chemicals-panel');
            CHEMICALS.forEach((chem, index) => {
                const btn = document.createElement('div');
                btn.className = 'chemical-btn';
                btn.style.background = `linear-gradient(135deg, ${chem.color}, ${darkenColor(chem.color)})`;
                btn.textContent = chem.name;
                btn.onclick = () => selectChemical(index);
                panel.appendChild(btn);
            });
        }

        function selectChemical(index) {
            selectedChemical = index;
            const btns = document.querySelectorAll('.chemical-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('selected', i === index);
            });
            updateInstructions();
        }

        function addChemicalToBeaker(beakerIndex) {
            if (selectedChemical === null) {
                alert('请先选择一种化学品！');
                return;
            }

            const beaker = beakers[beakerIndex];
            if (beaker.completed) {
                alert('这个烧杯已经完成反应了！');
                return;
            }

            if (beaker.substances.length >= 3) {
                alert('这个烧杯已满！');
                return;
            }

            const chemical = CHEMICALS[selectedChemical];
            beaker.substances.push(chemical);

            updateBeakerVisual(beakerIndex);

            if (beaker.substances.length === 3) {
                setTimeout(() => triggerReaction(beakerIndex), 300);
            }
        }

        function updateBeakerVisual(beakerIndex) {
            const beaker = beakers[beakerIndex];
            const beakerElement = beaker.beakerElement;

            const oldLiquid = beakerElement.querySelector('.liquid');
            if (oldLiquid) oldLiquid.remove();

            const mixedColor = mixColors(beaker.substances.map(s => s.rgb));
            const height = (beaker.substances.length / 3) * 100;

            const liquid = document.createElement('div');
            liquid.className = 'liquid';
            liquid.style.background = `linear-gradient(to top, ${mixedColor}, ${lightenColor(mixedColor)})`;
            liquid.style.height = height + '%';
            beakerElement.appendChild(liquid);

            const indicator = beaker.element.querySelector('.substance-indicator');
            indicator.innerHTML = '';
            beaker.substances.forEach(sub => {
                const dot = document.createElement('div');
                dot.className = 'substance-dot';
                dot.style.background = sub.color;
                indicator.appendChild(dot);
            });
        }

        function determineReactionType(substances) {
            const names = substances.map(s => s.name);

            // 爆炸：红色 + 橙色 或 红色 + 黄色
            if ((names.includes('红色') && names.includes('橙色')) ||
                (names.includes('红色') && names.includes('黄色')) ||
                (names.includes('红色') && names.includes('绿色'))) {
                return REACTION_TYPES.EXPLOSION;
            }

            // 气泡：绿色 + 蓝色 或 含有绿色
            if (names.includes('绿色') || (names.includes('蓝色') && names.includes('黄色'))) {
                return REACTION_TYPES.BUBBLES;
            }

            // 蒸汽：蓝色 + 红色（冷热反应）
            if (names.includes('蓝色') && names.includes('红色')) {
                return REACTION_TYPES.STEAM;
            }

            // 发光：紫色 + 青色 或 相同颜色
            if (names.every(n => n === names[0])) {
                return REACTION_TYPES.GLOW;
            }

            // 默认：颜色变化
            return REACTION_TYPES.COLOR_CHANGE;
        }

        function triggerReaction(beakerIndex) {
            const beaker = beakers[beakerIndex];
            const reactionType = determineReactionType(beaker.substances);
            beaker.reactionType = reactionType;

            // 显示反应类型
            const typeLabel = beaker.element.querySelector('.reaction-type');
            typeLabel.textContent = reactionType.name;

            // 添加震动效果
            beaker.element.classList.add('shake');
            setTimeout(() => beaker.element.classList.remove('shake'), 500);

            // 根据反应类型触发不同效果
            switch(reactionType) {
                case REACTION_TYPES.EXPLOSION:
                    createExplosion(beaker);
                    break;
                case REACTION_TYPES.BUBBLES:
                    createBubbles(beaker);
                    break;
                case REACTION_TYPES.STEAM:
                    createSteam(beaker);
                    break;
                case REACTION_TYPES.COLOR_CHANGE:
                    createColorChange(beaker);
                    break;
                case REACTION_TYPES.GLOW:
                    createGlow(beaker);
                    break;
            }

            setTimeout(() => {
                beaker.completed = true;
                beaker.element.classList.add('completed');
                completedCount++;
                updateStageInfo();

                reactionSummary.push(`烧杯${beakerIndex + 1}: ${reactionType.emoji}${reactionType.name}`);

                if (completedCount === 6) {
                    setTimeout(() => showCompletion(), 1000);
                }
            }, 3500);
        }

        function createExplosion(beaker) {
            const liquid = beaker.beakerElement.querySelector('.liquid');
            liquid.classList.add('color-change');

            // 创建爆炸粒子
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'explosion-particle';
                    particle.style.width = (Math.random() * 12 + 6) + 'px';
                    particle.style.height = particle.style.width;
                    particle.style.background = beaker.substances[Math.floor(Math.random() * 3)].color;
                    particle.style.left = '50%';
                    particle.style.bottom = '30%';

                    const angle = (Math.random() * 360) * Math.PI / 180;
                    const distance = Math.random() * 100 + 50;
                    particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                    particle.style.setProperty('--ty', Math.sin(angle) * distance - 50 + 'px');

                    beaker.beakerElement.appendChild(particle);
                    setTimeout(() => particle.remove(), 1000);
                }, i * 30);
            }
        }

        function createBubbles(beaker) {
            const liquid = beaker.beakerElement.querySelector('.liquid');

            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    const size = Math.random() * 15 + 8;
                    bubble.style.width = size + 'px';
                    bubble.style.height = size + 'px';
                    bubble.style.left = (Math.random() * 80 + 10) + '%';
                    bubble.style.bottom = '5%';
                    beaker.beakerElement.appendChild(bubble);
                    setTimeout(() => bubble.remove(), 2000);
                }, i * 80);
            }
        }

        function createSteam(beaker) {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const steam = document.createElement('div');
                    steam.className = 'steam';
                    const size = Math.random() * 30 + 20;
                    steam.style.width = size + 'px';
                    steam.style.height = size + 'px';
                    steam.style.left = (Math.random() * 60 + 20) + '%';
                    steam.style.bottom = '100%';
                    beaker.beakerElement.appendChild(steam);
                    setTimeout(() => steam.remove(), 3000);
                }, i * 150);
            }
        }

        function createColorChange(beaker) {
            const liquid = beaker.beakerElement.querySelector('.liquid');
            liquid.classList.add('color-change');

            let hue = 0;
            const interval = setInterval(() => {
                hue += 10;
                liquid.style.filter = `hue-rotate(${hue}deg) saturate(1.5)`;
                if (hue >= 180) {
                    clearInterval(interval);
                    liquid.style.filter = '';
                    liquid.classList.remove('color-change');
                }
            }, 100);
        }

        function createGlow(beaker) {
            const liquid = beaker.beakerElement.querySelector('.liquid');
            liquid.classList.add('glow');

            setTimeout(() => {
                liquid.classList.remove('glow');
            }, 3000);
        }

        function mixColors(rgbStrings) {
            let r = 0, g = 0, b = 0;
            rgbStrings.forEach(rgb => {
                const matches = rgb.match(/\d+/g);
                r += parseInt(matches[0]);
                g += parseInt(matches[1]);
                b += parseInt(matches[2]);
            });
            const count = rgbStrings.length;
            return `rgb(${Math.floor(r/count)}, ${Math.floor(g/count)}, ${Math.floor(b/count)})`;
        }

        function darkenColor(hex) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.max(0, ((num >> 16) & 0xff) - 40);
            const g = Math.max(0, ((num >> 8) & 0xff) - 40);
            const b = Math.max(0, (num & 0xff) - 40);
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        function lightenColor(rgb) {
            const matches = rgb.match(/\d+/g);
            const r = Math.min(255, parseInt(matches[0]) + 60);
            const g = Math.min(255, parseInt(matches[1]) + 60);
            const b = Math.min(255, parseInt(matches[2]) + 60);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function updateInstructions() {
            const inst = document.getElementById('instructions');
            if (selectedChemical === null) {
                inst.textContent = '👉 点击右侧选择一种化学品，然后点击烧杯添加';
            } else {
                inst.textContent = `已选择：${CHEMICALS[selectedChemical].name} | 👆 点击烧杯添加（每个烧杯需要3种物质）`;
            }
        }

        function updateStageInfo() {
            document.getElementById('stage-info').textContent = `阶段 1/2 | 完成: ${completedCount}/6`;
        }

        function showCompletion() {
            const summary = document.getElementById('completion-summary');
            summary.innerHTML = `
                你成功完成了所有6个化学实验！<br><br>
                <strong>反应总结：</strong><br>
                ${reactionSummary.join('<br>')}
                <br><br>
                每种化学品组合都产生了独特的反应效果！
            `;
            document.getElementById('completion-modal').classList.add('show');
        }

        init();
    </script>
</body>
</html>
