<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D化学实验室测试</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            z-index: 10;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 100;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="loading">加载中...</div>
    <div id="info">3D化学实验室<br><small>加载Three.js库...</small></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        console.log('脚本开始执行...');

        try {
            const loading = document.getElementById('loading');
            const info = document.getElementById('info');

            loading.textContent = '正在加载Three.js...';
            console.log('开始导入Three.js');

            import('three').then(THREE_MODULE => {
                console.log('Three.js加载成功', THREE_MODULE);
                loading.textContent = '正在加载OrbitControls...';

                return import('three/addons/controls/OrbitControls.js').then(CONTROLS_MODULE => {
                    console.log('OrbitControls加载成功');
                    loading.style.display = 'none';

                    const THREE = THREE_MODULE;
                    const { OrbitControls } = CONTROLS_MODULE;

                    // 创建场景
                    const scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x87ceeb);

                    // 创建相机
                    const camera = new THREE.PerspectiveCamera(
                        75,
                        window.innerWidth / window.innerHeight,
                        0.1,
                        1000
                    );
                    camera.position.set(0, 2, 5);

                    // 创建渲染器
                    const renderer = new THREE.WebGLRenderer({ antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.body.appendChild(renderer.domElement);

                    // 添加控制器
                    const controls = new OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;

                    // 添加光源
                    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                    scene.add(ambientLight);

                    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                    directionalLight.position.set(5, 5, 5);
                    scene.add(directionalLight);

                    // 添加地板
                    const floorGeometry = new THREE.PlaneGeometry(20, 20);
                    const floorMaterial = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        roughness: 0.8
                    });
                    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                    floor.rotation.x = -Math.PI / 2;
                    scene.add(floor);

                    // 创建6个烧杯
                    const beakers = [];
                    for (let i = 0; i < 6; i++) {
                        const group = new THREE.Group();

                        // 玻璃烧杯
                        const glassGeometry = new THREE.CylinderGeometry(0.3, 0.25, 1, 32, 1, true);
                        const glassMaterial = new THREE.MeshPhysicalMaterial({
                            color: 0xccffff,
                            transparent: true,
                            opacity: 0.3,
                            roughness: 0.1,
                            metalness: 0.1,
                            transmission: 0.9,
                            thickness: 0.5
                        });
                        const glass = new THREE.Mesh(glassGeometry, glassMaterial);
                        glass.position.y = 0.5;
                        group.add(glass);

                        // 底座
                        const baseGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 32);
                        const baseMaterial = new THREE.MeshStandardMaterial({
                            color: 0x999999
                        });
                        const base = new THREE.Mesh(baseGeometry, baseMaterial);
                        base.position.y = 0.05;
                        group.add(base);

                        // 位置
                        const x = (i % 3 - 1) * 2;
                        const z = Math.floor(i / 3) * 2 - 1;
                        group.position.set(x, 0, z);

                        scene.add(group);
                        beakers.push(group);
                    }

                    // 添加化学品按钮（在3D空间中）
                    const chemicals = [
                        { name: '黄色', color: 0xFFFF00 },
                        { name: '蓝色', color: 0x0066FF },
                        { name: '绿色', color: 0x00FF66 },
                        { name: '紫色', color: 0x9933FF },
                        { name: '红色', color: 0xFF3333 },
                        { name: '橙色', color: 0xFF9933 },
                        { name: '青色', color: 0x00FFFF }
                    ];

                    chemicals.forEach((chem, i) => {
                        const sphereGeometry = new THREE.SphereGeometry(0.2, 32, 32);
                        const sphereMaterial = new THREE.MeshStandardMaterial({
                            color: chem.color,
                            emissive: chem.color,
                            emissiveIntensity: 0.3
                        });
                        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                        sphere.position.set(4, 0.5 + i * 0.6, 0);
                        scene.add(sphere);
                    });

                    // 更新信息
                    info.innerHTML = `
                        <strong>3D化学实验室已加载成功！</strong><br>
                        <small>使用鼠标拖动旋转视角，滚轮缩放</small><br>
                        <small>左侧：6个烧杯 | 右侧：7种化学品</small>
                    `;

                    // 窗口调整
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    // 动画循环
                    function animate() {
                        requestAnimationFrame(animate);

                        // 旋转烧杯
                        beakers.forEach((beaker, i) => {
                            beaker.rotation.y += 0.002 * (i + 1);
                        });

                        controls.update();
                        renderer.render(scene, camera);
                    }

                    animate();
                    console.log('场景渲染成功！');
                });
            }).catch(error => {
                console.error('加载失败:', error);
                loading.textContent = '加载失败: ' + error.message;
                loading.style.color = 'red';
                info.innerHTML = `
                    <strong style="color: red;">加载错误</strong><br>
                    <small>${error.message}</small><br>
                    <small>请检查浏览器控制台</small>
                `;
            });

        } catch (error) {
            console.error('致命错误:', error);
            document.body.innerHTML = `
                <div style="color: white; padding: 50px; font-size: 18px;">
                    <h2>发生错误</h2>
                    <p>${error.message}</p>
                    <p>请使用现代浏览器（Chrome, Firefox, Edge）</p>
                </div>
            `;
        }
    </script>
</body>
</html>
